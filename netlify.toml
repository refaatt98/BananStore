# ─────────────────────────────────────────────────────────────
# Netlify — متجر بَنان
# ─────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# روابط مألوفة قد يكتبها الزوار
[[redirects]]
  from = "/basket"
  to = "/cart"
  status = 301

[[redirects]]
  from = "/favorites"
  to = "/wishlist"
  status = 301

[[redirects]]
  from = "/about"
  to = "/story"
  status = 301

# تطبيق صفحة واحدة — React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# إعدادات الأمان والسماح بالتضمين داخل iframe
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "frame-ancestors *"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# التخزين المؤقت للملفات الثابتة
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
